<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Stars 0, Contributions 201, Repos 6, Followers 2">
  <title>Profile signal</title>
  <defs>
    <linearGradient id="stats-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="stats-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stats-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#39d353" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stats-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#a371f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stats-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    #stats .orb-a { animation: stats-float-a 9s ease-in-out infinite; }
    #stats .orb-b { animation: stats-float-b 11s ease-in-out infinite 1.1s; }
    #stats .orb-c { animation: stats-float-c 13s ease-in-out infinite 0.6s; }
    #stats .cursor { animation: stats-cursor 1.2s step-end infinite; }
    #stats .ring { animation: stats-ring 8s ease-in-out infinite; }
    #stats .ring-b { animation: stats-ring 10s ease-in-out infinite 1.6s; }
    #stats .chip { animation: stats-chip 650ms ease-out both; }
    @keyframes stats-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes stats-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes stats-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes stats-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes stats-ring { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes stats-chip { from { transform: translateY(8px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      #stats * { animation: none !important; }
    }
  </style>
  <g id="stats">
    <rect width="860" height="260" rx="20" fill="url(#stats-bg)"/>
    <ellipse class="orb-a" cx="138" cy="47" rx="206" ry="120" fill="url(#stats-orb-0)"/>
    <ellipse class="orb-b" cx="654" cy="57" rx="241" ry="109" fill="url(#stats-orb-1)"/>
    <ellipse class="orb-c" cx="499" cy="229" rx="310" ry="88" fill="url(#stats-orb-2)"/>
    <ellipse class="orb-b" cx="826" cy="203" rx="172" ry="109" fill="url(#stats-orb-3)"/>
    <circle class="ring" cx="735" cy="82" r="20.88" fill="none" stroke="#e6edf3" stroke-opacity="0.36"/>
    <circle class="ring-b" cx="735" cy="82" r="35.96" fill="none" stroke="#e6edf3" stroke-opacity="0.22"/>
    <circle class="ring" cx="735" cy="82" r="58" fill="none" stroke="#e6edf3" stroke-opacity="0.14"/>
    <g transform="rotate(-32 735 82)">
      <circle cx="770.96" cy="82" r="4" fill="#58a6ff">
        <animateTransform attributeName="transform" type="scale" values="0.85;1.2;0.85" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="28" y="26" width="804" height="206" rx="20" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.48"/>
    <text x="46" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="850" letter-spacing="-0.5" fill="#e6edf3">Profile Signal</text>
    <text x="48" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="650" letter-spacing="1.2" fill="#8b949e">Live GitHub stats, rebuilt nightly</text>
    <g class="chip" style="animation-delay:0ms">
      <rect x="34" y="92" width="180" height="122" rx="18" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.72"/>
      <text x="56" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" fill="#8b949e">Stars</text>
      <text x="56" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="900" letter-spacing="-0.8" fill="#58a6ff">0</text>
      <rect x="56" y="186" width="136" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="56" y="186" width="11" height="7" rx="3.5" fill="#58a6ff" opacity="0.9"/>
    </g><g class="chip" style="animation-delay:100ms">
      <rect x="238" y="92" width="180" height="122" rx="18" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.72"/>
      <text x="260" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" fill="#8b949e">Contributions</text>
      <text x="260" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="900" letter-spacing="-0.8" fill="#2ad5ef">201</text>
      <rect x="260" y="186" width="136" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="260" y="186" width="104" height="7" rx="3.5" fill="#2ad5ef" opacity="0.9"/>
    </g><g class="chip" style="animation-delay:200ms">
      <rect x="442" y="92" width="180" height="122" rx="18" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.72"/>
      <text x="464" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" fill="#8b949e">Repos</text>
      <text x="464" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="900" letter-spacing="-0.8" fill="#a371f7">6</text>
      <rect x="464" y="186" width="136" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="464" y="186" width="77" height="7" rx="3.5" fill="#a371f7" opacity="0.9"/>
    </g><g class="chip" style="animation-delay:300ms">
      <rect x="646" y="92" width="180" height="122" rx="18" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.72"/>
      <text x="668" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="1.4" fill="#8b949e">Followers</text>
      <text x="668" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="900" letter-spacing="-0.8" fill="#43d55c">2</text>
      <rect x="668" y="186" width="136" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="668" y="186" width="32" height="7" rx="3.5" fill="#43d55c" opacity="0.9"/>
    </g>
    <rect x="0.5" y="0.5" width="859" height="259" rx="19.5" fill="none" stroke="#58a6ff" stroke-opacity="0.62"/>
  </g>
</svg>
