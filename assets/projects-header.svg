<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="56" viewBox="0 0 860 56" role="img" aria-label="PROJECTS.LIST — 4 pinned">
  <title>PROJECTS.LIST</title>
  <defs>
    <linearGradient id="projects-header-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="projects-header-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="projects-header-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.42"/>
      <stop offset="58%" stop-color="#39d353" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    #projects-header .orb-a { animation: projects-header-float-a 9s ease-in-out infinite; }
    #projects-header .orb-b { animation: projects-header-float-b 11s ease-in-out infinite 1.1s; }
    #projects-header .orb-c { animation: projects-header-float-c 13s ease-in-out infinite 0.6s; }
    #projects-header .cursor { animation: projects-header-cursor 1.2s step-end infinite; }
    #projects-header .ring { animation: projects-header-ring 8s ease-in-out infinite; }
    #projects-header .ring-b { animation: projects-header-ring 10s ease-in-out infinite 1.6s; }
    #projects-header .chip { animation: projects-header-chip 650ms ease-out both; }
    @keyframes projects-header-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes projects-header-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes projects-header-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes projects-header-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes projects-header-ring { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes projects-header-chip { from { transform: translateY(8px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      #projects-header * { animation: none !important; }
    }
  </style>
  <g id="projects-header">
    <rect width="860" height="56" rx="16" fill="url(#projects-header-bg)"/>
    <ellipse class="orb-a" cx="138" cy="10" rx="361" ry="44" fill="url(#projects-header-orb-0)"/>
    <ellipse class="orb-b" cx="705" cy="48" rx="327" ry="39" fill="url(#projects-header-orb-1)"/>
    <text x="30" y="34" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#58a6ff">PROJECTS.LIST</text>
    <text x="180" y="34" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e" fill-opacity="0.8">./projects.sh --all</text>
    <text x="830" y="34" text-anchor="end" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e" fill-opacity="0.7">4 pinned</text>
    <line x1="28" y1="46" x2="832" y2="46" stroke="#58a6ff" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>
</svg>
