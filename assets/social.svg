<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="126" viewBox="0 0 860 126" role="img" aria-label="GitHub @lllnightlll">
  <title>GitHub @lllnightlll</title>
  <defs>
    <linearGradient id="social-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="54%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="social-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="social-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#39d353" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="social-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.72"/>
      <stop offset="58%" stop-color="#a371f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="social-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="58%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="social-holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="18%" stop-color="#0d1117"/>
      <stop offset="38%" stop-color="#58a6ff"/>
      <stop offset="58%" stop-color="#8b949e"/>
      <stop offset="78%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    #social .orb-a { animation: social-float-a 9s ease-in-out infinite; }
    #social .orb-b { animation: social-float-b 11s ease-in-out infinite 1.1s; }
    #social .orb-c { animation: social-float-c 13s ease-in-out infinite 0.6s; }
    #social .cursor { animation: social-cursor 1.2s step-end infinite; }
    #social .ring { animation: social-ring 8s ease-in-out infinite; }
    #social .ring-b { animation: social-ring 10s ease-in-out infinite 1.6s; }
    #social .chip { animation: social-chip 650ms ease-out both; }
    @keyframes social-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes social-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes social-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes social-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes social-ring { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes social-chip { from { transform: translateY(8px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      #social * { animation: none !important; }
    }
  </style>
  <g id="social">
    <rect width="860" height="126" rx="20" fill="url(#social-bg)"/>
    <ellipse class="orb-a" cx="138" cy="23" rx="206" ry="58" fill="url(#social-orb-0)"/>
    <ellipse class="orb-b" cx="654" cy="28" rx="241" ry="53" fill="url(#social-orb-1)"/>
    <ellipse class="orb-c" cx="499" cy="111" rx="310" ry="43" fill="url(#social-orb-2)"/>
    <ellipse class="orb-b" cx="826" cy="98" rx="172" ry="53" fill="url(#social-orb-3)"/>
    <rect x="26" y="22" width="808" height="82" rx="22" fill="rgba(8,8,12,0.5)" stroke="#58a6ff" stroke-opacity="0.48"/>
    <g class="chip">
      <rect x="341" y="40" width="178" height="46" rx="23" fill="rgba(8,8,12,0.5)" stroke="url(#social-holo)" stroke-width="2"/>
      <rect x="342" y="41" width="176" height="44" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
      <circle cx="368" cy="63" r="12" fill="#ffffff" fill-opacity="0.16"/>
      <text x="368" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
      <text x="389" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="850" letter-spacing="1.2" fill="#8b949e">GitHub</text>
      <text x="389" y="75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#e6edf3">@lllnightlll</text>
    </g>
    <rect x="0.5" y="0.5" width="859" height="125" rx="19.5" fill="none" stroke="#58a6ff" stroke-opacity="0.62"/>
  </g>
</svg>
